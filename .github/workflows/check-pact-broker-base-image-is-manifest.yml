name: Check Pact broker image

on:
  pull_request:
    paths:
      - 'ci/docker/pact-broker/**'

permissions:
  contents: read

jobs:
  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@9c119b67b8c05cf03d3a08be6dfac4836f804e1f
    with:
      dockerfile: ./ci/docker/pact-broker/Dockerfile
