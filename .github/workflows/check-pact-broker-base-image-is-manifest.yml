name: Check Pact broker image

on:
  pull_request:
    paths:
      - 'ci/docker/pact-broker/**'

permissions:
  contents: read

jobs:
  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@042a7e3d823df3b1ba6cbab336f97c07e65dc4e9
    with:
      dockerfile: ./ci/docker/pact-broker/Dockerfile
